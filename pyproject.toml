[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyparaglide"
version = "2.0.0"
description = "AI-based paragliding flyability forecasting (modernized fork of Paraglidable with TensorFlow 2.15+)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Evgeny Istomin", email = "genajoin@gmail.com"}
]
maintainers = [
    {name = "Evgeny Istomin", email = "genajoin@gmail.com"}
]
keywords = [
    "paragliding",
    "forecasting",
    "machine-learning",
    "weather",
    "gfs",
    "tensorflow",
    "cli",
    "python312"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"

dependencies = [
    # Core ML
    "tensorflow>=2.15,<2.20",
    "numpy>=1.26.0,<2.0",  # TF 2.15 compatibility

    # Data processing
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "pyproj>=3.5.0",

    # Weather data
    "pygrib>=2.1.5",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",  # Better CLI output
    "tqdm>=4.66.0",
    "colorama>=0.4.6",

    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Utilities
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",

    # Geospatial
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.12.0",
]

# IGC parsing (optional - only if extending with IGC file support)
igc = [
    "libigc>=1.1.0",
    "aerofiles>=1.0.0",
]

[project.urls]
"Source Code" = "https://github.com/Genajoin/PyParaglide"
"Original Project" = "https://github.com/Genajoin/Paraglidable"
"Original Homepage" = "https://paraglidable.com"
Documentation = "https://github.com/Genajoin/PyParaglide/tree/master/docs"
"Bug Tracker" = "https://github.com/Genajoin/PyParaglide/issues"
Changelog = "https://github.com/Genajoin/PyParaglide/blob/master/CHANGELOG.md"

[project.scripts]
pyparaglide = "pyparaglide.cli:app"
# Backward compatibility alias (optional, can be removed later)
paraglidable = "pyparaglide.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyparaglide = ["py.typed"]

# Black formatting
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

# Ruff linting
[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults (typer uses this)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# MyPy type checking
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
ignore_missing_imports = true  # Many scientific packages lack stubs

# Pytest
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring data files",
]
